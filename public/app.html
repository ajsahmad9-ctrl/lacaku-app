<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Lacaku</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@700;800&family=Roboto+Mono:wght@600;700&display=swap">
  <style>
    :root {
      --brand-900:#081D33;
      --brand-700:#0F3E68;
      --brand-500:#2874B3;
      --brand-100:#E2EEF9;
      --ink-900:#152233;
      --ink-700:#33465A;
      --ink-600:#4B5F73;
      --line:#E1E9F0;
      --surface-raised:#FFFFFF;
      --sidebar-bg:#081D33;
      --sidebar-bg-2:#0D2F52;
      --brand-solid:#155690;
      --brand-solid-hover:#1B6AAE;
      --brand-solid-active:#0F3E68;
      --success:#16A34A;
      --success-bg:#E5F7EB;
      --success-ink:#0E7A34;
      --shadow-lg:0 16px 40px rgba(8,29,51,.18);
      --font-ui:'Inter','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
      --font-display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      color: var(--ink-900);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--sidebar-bg-2), var(--sidebar-bg));
      padding: 20px;
    }
    .card {
      background: var(--surface-raised);
      padding: 34px 28px;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; object-fit: contain; }
    h1 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; font-size: 19px; margin: 0 0 6px; }
    p { color: var(--ink-600); font-size: 13.5px; margin: 0; }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 11px 28px;
      border-radius: 999px;
      background: var(--brand-solid);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: var(--brand-solid-hover); }
    .badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-ink);
      font-size: 12.5px;
      font-weight: 700;
    }
    .logout { display: block; margin-top: 1.5rem; color: var(--ink-600); font-size: 12.5px; text-decoration: none; }
    .logout:hover { color: var(--brand-500); }
  </style>
</head>

    let pollTimer = null;

    async function refresh() {
      let res, data;
      try {
        res = await fetch('/api/me', { cache: 'no-store' });
      } catch (err) {
        return; // gangguan jaringan sesaat - biarkan interval coba lagi nanti
      }
      if (res.status === 401) {
        window.location.href = '/';
        return;
      }
      data = await res.json();
      render(data);

      // Begitu status unlocked terdeteksi true, hentikan polling - tidak
      // perlu terus-menerus tanya server lagi setelah tujuan tercapai.
      if (data.unlocked && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function render(data) {
      const card = document.getElementById('card');
      if (data.unlocked) {
        card.innerHTML = `
          <img class="logo" src="${LOGO_SRC}" alt="Lacaku" />
          <h1>Halo, ${escapeHtml(data.name || data.email)}</h1>
          <span class="badge">Akses Terbuka</span>
          <p style="margin-top:10px;">Anda sudah bisa mengakses semua fitur Lacaku.</p>
          <a class="btn" href="%%LACAKU_APP_URL%%" target="_blank" rel="noopener">Buka Lacaku</a>
          <a class="logout" href="/logout">Keluar</a>
        `;
      } else {
        card.innerHTML = `
          <img class="logo" src="${LOGO_SRC}" alt="Lacaku" />
          <h1>Halo, ${escapeHtml(data.name || data.email)}</h1>
          <p>Akses Anda masih terkunci. Buka semua fitur Lacaku dengan sekali bayar.</p>
          <button class="btn" id="btnBuka">Buka Semua</button>
          <a class="logout" href="/logout">Keluar</a>
        `;
        document.getElementById('btnBuka').addEventListener('click', () => {
          window.location.href = '/checkout';
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    refresh();
    // Polling berkala supaya status unlocked ter-update otomatis begitu
    // webhook Scalev diproses di server, tanpa user perlu refresh manual.
    pollTimer = setInterval(refresh, 4000);
  </script>
