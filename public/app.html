<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f7;
    }
    .card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #555; }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: #16a34a;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .logout { display: block; margin-top: 1.5rem; color: #999; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p>Memuat...</p>
  </div>

  <script>
    let pollTimer = null;

    async function refresh() {
      let res, data;
      try {
        res = await fetch('/api/me', { cache: 'no-store' });
      } catch (err) {
        return; // gangguan jaringan sesaat - biarkan interval coba lagi nanti
      }
      if (res.status === 401) {
        window.location.href = '/';
        return;
      }
      data = await res.json();
      render(data);

      // Begitu status unlocked terdeteksi true, hentikan polling - tidak
      // perlu terus-menerus tanya server lagi setelah tujuan tercapai.
      if (data.unlocked && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function render(data) {
      const card = document.getElementById('card');
      if (data.unlocked) {
        card.innerHTML = `
          <h1>Halo, ${escapeHtml(data.name || data.email)}</h1>
          <span class="badge">Akses Terbuka</span>
          <p>Anda sudah bisa mengakses semua fitur.</p>
          <a class="logout" href="/logout">Keluar</a>
        `;
      } else {
        card.innerHTML = `
          <h1>Halo, ${escapeHtml(data.name || data.email)}</h1>
          <p>Akses Anda masih terkunci. Buka semua fitur dengan sekali bayar.</p>
          <button class="btn" id="btnBuka">Buka Semua</button>
          <a class="logout" href="/logout">Keluar</a>
        `;
        document.getElementById('btnBuka').addEventListener('click', () => {
          window.location.href = '/checkout';
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    refresh();
    // Polling berkala supaya status unlocked ter-update otomatis begitu
    // webhook Scalev diproses di server, tanpa user perlu refresh manual.
    pollTimer = setInterval(refresh, 4000);
  </script>
</body>
</html>
